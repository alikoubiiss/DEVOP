server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta que no sea un fichero devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los ficheros con hash se pueden cachear para siempre
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
