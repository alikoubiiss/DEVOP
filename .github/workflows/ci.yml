name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm test -- --no-watch
      - run: npm run build

  docker:
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ea-seminari6-angular-backoffice
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main)
              tags="$IMAGE:dev,$IMAGE:${GITHUB_SHA}"
              ;;
            refs/tags/v*)
              tags="$IMAGE:${GITHUB_REF#refs/tags/},$IMAGE:${GITHUB_SHA},$IMAGE:latest"
              ;;
            *)
              echo "::error::unsupported ref ${GITHUB_REF}"
              exit 1
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
